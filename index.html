<!doctype html>
<html lang="en">
  <head>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      document.documentElement.style.scrollBehavior = 'auto';
      if (window.location.hash) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Un Rithy Reach // Software Developer & Full Stack Developer Portfolio</title>
    <meta name="description" content="Portfolio of Un Rithy Reach — Founder & Lead Software Developer at Odyssey Forge specializing in Laravel, PHP, Node.js, Express, React, TypeScript, Vue 3, Docker, and REST APIs." />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Un Rithy Reach // Software Developer & Full Stack Developer" />
    <meta property="og:description" content="Full-stack web applications, Laravel, PHP, Node.js, React, TypeScript, Vue 3, Docker, and system architecture." />
    
    <!-- Structured Data (JSON-LD) for Recruiters & Search Crawlers -->

    {
      "@context": "https://schema.org",

        "PHP & Laravel",

        "React 19 & Vue 3",
        "Node.js & Express",
        "MySQL & PostgreSQL",

        "Zod Schema Validation",

      ],
      "alumniOf": {
        "@type": "EducationalOrganization",
        "name": "Information Technology Engineering (ITE) @ Royal University of Phnom Penh (RUPP)"
      }
    }
    </script>
  </head>
  <body class="bg-[#050505] text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
